name: Deploy Firestore Indexes

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.indexes.json' # يعمل فقط عند تعديل هذا الملف

jobs:
  deploy-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Indexes
        run: |
          # إنشاء ملف الاعتماد من الأسرار
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /opt/google.json
          export GOOGLE_APPLICATION_CREDENTIALS=/opt/google.json
          
          # نشر الفهارس فقط
          firebase deploy --only firestore:indexes --project aljawad-app --non-interactive
